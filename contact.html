<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تواصل معي | مشروعي النهائي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="brand">ملفي ومشاريعي</div>

    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="projects.html">مشاريعي</a>
      <a href="contact.html">تواصل معي</a>
    </nav>
  </header>

  <main>
    <h1>تواصل معي</h1>

    <section class="panel">

      <form id="contact-form" novalidate>

        <label for="name">الاسم</label>
        <input
          id="name"
          name="name"
          required
          autocomplete="name"
        >

        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
        >

        <label for="message">
          الرسالة (10 أحرف على الأقل)
        </label>

        <textarea
          id="message"
          name="message"
          rows="5"
          required
          minlength="10"
        ></textarea>

        <p>
          <button type="submit" id="send">
            إرسال
          </button>
        </p>

      </form>

      <p class="status" id="status" aria-live="polite">
        املأ الحقول ثم اضغط إرسال.
      </p>

    </section>

    <p class="muted">
      هذه تجربة تعليمية: JSONPlaceholder يستقبل الطلب
      لكنه لا يحفظ الرسائل بشكل دائم.
    </p>

  </main>

  <footer>
    مشروع JavaScript النهائي • Pathy
  </footer>

  <script type="module" src="js/contact.js"></script>

</body>
</html>
